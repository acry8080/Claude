<style>
/* Layout: appli bancaire — une colonne centrée (760px), carte « solde » en tête, puis comptes et fil d'opérations ; onglets en haut sur ordinateur, en bas sur téléphone */
:root {
  --bg: #f2f4f7;
  --surface: #ffffff;
  --surface-2: #eef1f5;
  --ink: #111827;
  --muted: #6b7385;
  --line: #e2e6ec;
  --hero: #0f1b3d;
  --hero-ink: #f5f7ff;
  --hero-muted: #a9b4d6;
  --accent: #3d5afe;
  --accent-soft: #e6eaff;
  --on-accent: #ffffff;
  --good: #128a52;
  --good-soft: #def4e8;
  --warn: #a15c00;
  --warn-soft: #fdf0d9;
  --bad: #c62828;
  --bad-soft: #fde4e2;
  --display: "Manrope", "Helvetica Neue", Arial, sans-serif;
  --body: "DM Sans", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b0f17; --surface: #141a25; --surface-2: #1b2331; --ink: #eef1f7; --muted: #95a0b4; --line: #252e3e;
  --hero: #1a2a63; --hero-ink: #f5f7ff; --hero-muted: #b6c0e4;
  --accent: #8a9cff; --accent-soft: #1e2650; --on-accent: #0b1020;
  --good: #4fd394; --good-soft: #12301f; --warn: #f3bd5d; --warn-soft: #36290f; --bad: #ff8a80; --bad-soft: #3b1918;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b0f17; --surface: #141a25; --surface-2: #1b2331; --ink: #eef1f7; --muted: #95a0b4; --line: #252e3e;
  --hero: #1a2a63; --hero-ink: #f5f7ff; --hero-muted: #b6c0e4;
  --accent: #8a9cff; --accent-soft: #1e2650; --on-accent: #0b1020;
  --good: #4fd394; --good-soft: #12301f; --warn: #f3bd5d; --warn-soft: #36290f; --bad: #ff8a80; --bad-soft: #3b1918;
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.n { font-variant-numeric: tabular-nums; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 16px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.logo { font: 800 1.05rem var(--display); letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.logo i { width: 26px; height: 26px; border-radius: 8px; background: var(--hero); display: grid; place-items: center; color: var(--hero-ink); font-style: normal; font-size: .8rem; }
.tabs { display: flex; gap: 4px; margin-left: auto; }
.tabs button { border: 0; background: none; padding: 7px 12px; border-radius: 999px; color: var(--muted); font-weight: 600; }
.tabs button[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
nav.bottom { display: none; }

main { max-width: 760px; margin: 0 auto; padding-block: 20px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.demo { font-size: .82rem; color: var(--warn); background: var(--warn-soft); border-radius: 10px; padding: 8px 12px; }
h1 { font: 800 1.6rem/1.15 var(--display); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
h2 { font: 700 1.02rem/1.2 var(--display); margin: 0; }
.row-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.sub { color: var(--muted); font-size: .88rem; margin: 0; }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0; }

/* Carte solde */
.hero { background: var(--surface); color: var(--ink); border-radius: 16px; padding: 18px 20px 12px; overflow: hidden; border: 1px solid var(--line); }
.hero .lbl { color: var(--muted); font-size: .86rem; }
.hero .big { font: 800 2.3rem/1.05 var(--display); letter-spacing: -.03em; margin-top: 2px; }
.hero .big small { font-size: 1.4rem; }
.hero .delta { display: inline-flex; gap: 6px; align-items: center; margin-top: 4px; font-size: .86rem; color: var(--muted); }
.hero .delta b { color: var(--good); font-weight: 600; }
.spark { display: block; width: 100%; height: 56px; margin-top: 8px; }
.hero-foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }

.comptes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.compte { background: var(--surface); border-radius: 14px; padding: 12px 14px; min-width: 0; border: 1px solid var(--line); text-align: left; }
.compte .ic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; margin-bottom: 10px; }
.compte .ic svg { width: 17px; height: 17px; }
.compte .lbl { font-size: .8rem; color: var(--muted); }
.compte .val { font: 700 1.12rem/1.2 var(--display); letter-spacing: -.01em; }
.compte .hint { font-size: .76rem; color: var(--muted); }

.alerts { display: grid; gap: 8px; }
.alert { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 12px; padding: 10px 14px; border: 1px solid var(--line); width: 100%; text-align: left; }
.alert .dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; font: 700 .9rem var(--display); }
.alert .txt { min-width: 0; flex: 1; }
.alert .txt b { display: block; font-weight: 600; }
.alert .chev { color: var(--muted); }

.card { background: var(--surface); border-radius: 14px; padding: 4px 0; border: 1px solid var(--line); }
.card.pad { padding: 16px; }
.day { font-size: .78rem; font-weight: 600; color: var(--muted); padding: 10px 16px 4px; text-transform: uppercase; letter-spacing: .06em; }
.op { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; text-align: left; padding: 10px 16px; }
.op:hover { background: var(--surface-2); }
.av { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; font: 700 .72rem var(--display); }
.op .mid { min-width: 0; flex: 1; }
.op .mid > span, .op .amt > span { display: block; }
.op .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.op .s { font-size: .82rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.op .amt { text-align: right; flex: none; }
.op .amt .a { font: 600 .95rem var(--display); font-variant-numeric: tabular-nums; }
.op .amt .p { font-size: .76rem; }
.plus { color: var(--good); }
.minus { color: var(--ink); }
.neg { color: var(--bad); }

.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; }

/* Carte billet : partie principale + talon détachable */
.tk { --site: #6b7385; position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 112px; width: 100%; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); text-align: left; padding: 0; overflow: hidden; }
.tk::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--site); }
.tk:hover { border-color: var(--muted); }
.tk-main { padding: 14px 14px 14px 20px; min-width: 0; display: grid; gap: 6px; align-content: start; }
.tk-top { display: flex; align-items: center; gap: 8px; font-size: .78rem; color: var(--muted); white-space: nowrap; min-width: 0; }
.tk-top span { overflow: hidden; text-overflow: ellipsis; }
.tk-site { font-weight: 700; color: var(--site); }
.tk-ev { font: 800 1.12rem/1.2 var(--display); letter-spacing: -.01em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tk-meta { font-size: .84rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tk-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tk-stub { position: relative; border-left: 2px dashed var(--line); background: var(--surface-2); display: grid; align-content: center; justify-items: center; gap: 2px; padding: 12px 8px; text-align: center; }
.tk-stub::before, .tk-stub::after { content: ""; position: absolute; left: -10px; width: 18px; height: 18px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); }
.tk-stub::before { top: -10px; } .tk-stub::after { bottom: -10px; }
.tk-k { font-size: .64rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.tk-v { font: 800 1.35rem/1.1 var(--display); font-variant-numeric: tabular-nums; }
.tk-s { font-size: .74rem; color: var(--muted); }
.tk-list { display: grid; gap: 10px; }

/* Défilement horizontal sur l'accueil */
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: min(320px, 86%); gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 2px 16px 6px; scrollbar-width: thin; }
.rail > * { scroll-snap-align: start; }
.chip { border: 0; background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: .86rem; font-weight: 600; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.search { width: 100%; border: 0; background: var(--surface); border-radius: 12px; padding: 10px 14px; }

.pill { display: inline-block; white-space: nowrap; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.p-list { background: var(--surface-2); color: var(--muted); }
.p-vente { background: var(--accent-soft); color: var(--accent); }
.p-vendu, .p-partiel { background: var(--good-soft); color: var(--good); }
.p-annule, .p-attente { background: var(--warn-soft); color: var(--warn); }
.p-rembourse { background: var(--bad-soft); color: var(--bad); }

/* Fiche */
.back { justify-self: start; }
.det-head { text-align: center; padding: 8px 0 4px; }
.det-head .av { width: 44px; height: 44px; margin: 0 auto 8px; font-size: .85rem; }
.det-head .big { font: 800 1.9rem/1.1 var(--display); letter-spacing: -.02em; }
.det-head .t { font-weight: 600; margin-top: 4px; text-wrap: balance; }
.det-head .s { color: var(--muted); font-size: .88rem; }
.list { display: grid; }
.li { display: flex; justify-content: space-between; gap: 16px; padding: 10px 16px; border-top: 1px solid var(--line); font-size: .92rem; }
.li:first-child { border-top: 0; }
.li span:first-child { color: var(--muted); }
.li span:last-child { text-align: right; overflow-wrap: anywhere; min-width: 0; }
.sec-title { font: 700 .82rem var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 6px 4px -8px; }

.seats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.seat { background: var(--surface-2); border-radius: 12px; padding: 10px; text-align: center; }
.seat .k { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.seat .v { font: 800 1.3rem var(--display); }
.tag { display: inline-block; font-size: .64rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 1px 6px; border-radius: 4px; }
.tag.auto { background: var(--good-soft); color: var(--good); }
.tag.main { background: var(--accent-soft); color: var(--accent); }
.tag.manque { background: var(--warn-soft); color: var(--warn); }
.alerte { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 10px 12px; font-size: .9rem; margin: 0 0 12px; }

form.f { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: end; }
.field { display: grid; gap: 4px; font-size: .8rem; color: var(--muted); min-width: 0; }
.field .tag { justify-self: start; }
.field input, .field select { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 11px; color: var(--ink); font-size: .95rem; }
.check { display: flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--ink); grid-column: 1 / -1; }
.btn { border: 0; border-radius: 12px; padding: 11px 16px; font-weight: 700; background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--bad); }
.btn.full { grid-column: 1 / -1; width: 100%; }
.btns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.note { font-size: .84rem; color: var(--muted); margin: 10px 0 0; }
.calc { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; font-size: .92rem; }
.calc .total { border-top: 1px solid var(--line); padding-top: 8px; font-weight: 700; }
.calc span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; }

/* Statistiques */
.bars { display: grid; gap: 12px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: .9rem; }
.bar-row .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track { grid-column: 1 / -1; height: 8px; background: var(--surface-2); border-radius: 4px; position: relative; overflow: hidden; }
.fill { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.zero { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--muted); left: 50%; }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 11px 16px; border-radius: 12px; font-weight: 500; max-width: calc(100% - 32px); z-index: 30; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: up .18s ease-out; } }
@keyframes up { from { opacity: 0; transform: translate(-50%, 8px); } }

@media (max-width: 640px) {
  .tabs { display: none; }
  nav.bottom { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  nav.bottom button { border: 0; background: none; display: grid; justify-items: center; gap: 2px; font-size: .7rem; font-weight: 600; color: var(--muted); padding: 4px; }
  nav.bottom button[aria-current="page"] { color: var(--accent); }
  nav.bottom svg { width: 22px; height: 22px; }
  main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  .comptes { grid-template-columns: minmax(0, 1fr); }
  .compte { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 0 12px; }
  .compte .ic { margin: 0; grid-row: span 2; }
  .compte .val { grid-row: span 2; grid-column: 3; text-align: right; }
  .compte .hint { grid-column: 2; }
  .hero .big { font-size: 2.3rem; }
  form.f { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
}
</style>

const fmt = (n, cur) => (n < 0 ? '−' : '') + Math.abs(n).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + (cur === 'USD' ? ' $' : ' €');
const eur = n => fmt(n);
const sign = n => (n > 0 ? '+' : '') + eur(n);
const coutEur = c => c.devise === 'USD' ? c.prix * USD_EUR : c.prix;
const unit = c => coutEur(c) / c.qte;
const vendus = c => c.ventes.reduce((s, v) => s + v.qte, 0);
const profitV = (c, v) => v.montant - unit(c) * v.qte;
const actif = c => !c.rembourse && !c.annulee && vendus(c) < c.qte;
const manquants = c => [!c.bloc && 'le bloc', !c.libre && !c.rang && 'le rang', !c.libre && !c.sieges && 'les sièges'].filter(Boolean);
const aCompleter = c => actif(c) && (manquants(c).length > 0 || !c.seatiks.section);
const places = c => c.libre || !c.rang ? 'x' + c.qte + ' · ' + c.bloc : [c.bloc, 'rang ' + c.rang, c.sieges].filter(Boolean).join(' · ');
const jourLong = s => new Date(s + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
const jourCourt = s => new Date(s + 'T12:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
const av = site => { const s = SITES[site] || { c: '#6b7385', i: site.slice(0, 2).toUpperCase() }; return '<span class="av" style="background:color-mix(in srgb, ' + s.c + ' 16%, transparent);color:' + s.c + '">' + s.i + '</span>'; };

function statut(c) {
  if (c.rembourse) return ['rembourse', 'Remboursé'];
  if (c.annulee) return ['annule', 'Annulation probable'];
  const v = vendus(c);
  if (v >= c.qte) return ['vendu', 'Vendu'];
  if (v > 0) return ['partiel', 'Vendu ' + v + '/' + c.qte];
  if (c.annonce && c.annonce.active) return ['vente', 'En vente'];
  return ['list', 'À lister'];
}
const pill = c => { const [k, t] = statut(c); return '<span class="pill p-' + k + '">' + t + '</span>'; };

function operations() {
  const ops = [];
  commandes.forEach(c => {
    ops.push({ type: 'achat', le: c.achat, c, montant: -coutEur(c), titre: c.ev, sous: 'Achat ' + c.site + ' · ' + c.qte + ' billet(s)', site: c.site, orig: c.devise === 'USD' ? fmt(-c.prix, 'USD') : '' });
    if (c.rembourse) ops.push({ type: 'remb', le: c.rembourse, c, montant: coutEur(c), titre: c.ev, sous: 'Remboursement ' + c.site, site: c.site });
    c.ventes.forEach(v => ops.push({ type: 'vente', le: v.le, c, v, montant: v.montant, titre: c.ev, sous: 'Vente Seatiks · ' + v.qte + ' billet(s)' + (v.paye ? '' : ' · en attente'), site: 'Seatiks', profit: profitV(c, v) }));
  });
  frais.forEach(f => ops.push({ type: 'frais', le: f.le, montant: -f.montant, titre: f.libelle, sous: 'Frais', site: 'Frais' }));
  return ops.sort((a, b) => b.le.localeCompare(a.le));
}

function totaux() {
  let profit = 0, aRecevoir = 0, nAttente = 0, stock = 0, stockN = 0, depMois = 0, recuMois = 0;
  const mois = '2026-10';
  commandes.forEach(c => {
    c.ventes.forEach(v => { profit += profitV(c, v); if (!v.paye) { aRecevoir += v.montant; nAttente++; } if (v.le.startsWith(mois)) recuMois += v.montant; });
    const r = c.qte - vendus(c);
    if (!c.rembourse && !c.annulee && r > 0) { stock += r * unit(c); stockN += r; }
    if (c.achat.startsWith(mois) && !c.rembourse) depMois += coutEur(c);
  });
  const fraisT = frais.reduce((s, f) => s + f.montant, 0);
  frais.forEach(f => { if (f.le.startsWith(mois)) depMois += f.montant; });
  const profitMois = commandes.reduce((s, c) => s + c.ventes.filter(v => v.le.startsWith(mois)).reduce((t, v) => t + profitV(c, v), 0), 0) - frais.filter(f => f.le.startsWith(mois)).reduce((s, f) => s + f.montant, 0);
  return { net: profit - fraisT, profitMois, aRecevoir, nAttente, stock, stockN, depMois, recuMois };
}

function sparkline() {
  const pts = commandes.flatMap(c => c.ventes.map(v => ({ le: v.le, p: profitV(c, v) }))).concat(frais.map(f => ({ le: f.le, p: -f.montant }))).sort((a, b) => a.le.localeCompare(b.le));
  let cum = 0; const ys = [0].concat(pts.map(x => (cum += x.p)));
  const W = 300, H = 70, min = Math.min(0, ...ys), max = Math.max(...ys), rng = max - min || 1;
  const xy = ys.map((y, i) => [i / (ys.length - 1) * W, H - 6 - (y - min) / rng * (H - 12)]);
  const line = xy.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const last = xy[xy.length - 1];
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-label="Évolution du bénéfice cumulé">' +
    '<polygon points="0,' + H + ' ' + line + ' ' + W + ',' + H + '" fill="var(--accent-soft)"/>' +

}

    '<div class="sec-title">Places</div><div class="card pad">' +
      (actif(c) && manque.length ? '<p class="alerte">Le site n\'a pas trouvé ' + manque.join(', ').replace(/, ([^,]*)$/, ' et $1') + ' dans l\'email ' + c.site + '. Complétez-les ici, ou cochez « Placement libre » pour une fosse ou une pelouse.</p>' : '') +
      '<div class="seats"><div class="seat"><div class="k">Bloc</div><div class="v">' + (c.bloc || '—') + '</div></div><div class="seat"><div class="k">Rang</div><div class="v">' + (c.rang || '—') + '</div></div><div class="seat"><div class="k">Sièges</div><div class="v">' + (c.sieges || '—') + '</div></div></div>' +
      '<form class="f" id="form-places" style="margin-top:12px">' +
        '<label class="field">Bloc ' + tag('bloc') + '<input id="pl-bloc" value="' + esc(c.bloc) + '" required></label>' +
        '<label class="field">Rang ' + tag('rang') + '<input id="pl-rang" value="' + esc(c.rang) + '" placeholder="ex. 13"' + (c.libre ? ' disabled' : '') + '></label>' +
        '<label class="field">Sièges ' + tag('sieges') + '<input id="pl-sieges" value="' + esc(c.sieges) + '" placeholder="ex. 35-36"' + (c.libre ? ' disabled' : '') + '></label>' +
        '<label class="check"><input type="checkbox" id="pl-libre"' + (c.libre ? ' checked' : '') + '> Placement libre (fosse, pelouse, places non numérotées)</label>' +
        (c.seatiks.choix.length ? '<label class="field" style="grid-column:1/-1">Section sur Seatiks ' + (c.seatiks.section ? '<span class="tag main">choisie par vous</span>' : '<span class="tag manque">pas trouvée</span>') + '<select id="pl-section"><option value="">Choisir la section…</option>' + c.seatiks.choix.map(o => '<option' + (o === c.seatiks.section ? ' selected' : '') + '>' + o + '</option>').join('') + '</select></label>'
          : '<p class="note" style="grid-column:1/-1;margin:0">Section sur Seatiks : <b>' + c.seatiks.section + '</b> <span class="tag auto">trouvée automatiquement</span></p>') +
        '<button class="btn full" type="submit">Enregistrer les places</button></form></div>' +

    '<div class="sec-title">Mise en vente Seatiks</div><div class="card pad">' + vente + '</div>' +

    '<div class="sec-title">Bénéfice</div><div class="card pad"><div class="calc"><span>Reçu pour ' + vendus(c) + ' billet(s)</span><span>' + eur(recu) + '</span><span>Coût de ces billets</span><span>' + eur(-unit(c) * vendus(c)) + '</span><span class="total">Bénéfice</span><span class="total ' + (profit >= 0 ? 'plus' : 'neg') + '">' + sign(profit) + '</span></div>' +
      (c.ventes.length ? '<div class="list" style="margin:12px -16px -16px">' + c.ventes.map(v => '<div class="li"><span>' + v.id + ' · ' + jourCourt(v.le) + ' · ' + v.qte + ' billet(s)</span><span>' + eur(v.montant) + ' <button class="pill ' + (v.paye ? 'p-vendu' : 'p-attente') + '" style="border:0" data-payer="' + v.id + '">' + (v.paye ? 'Payé' : 'En attente') + '</button></span></div>').join('') + '</div>' : '') + '</div>' +

    '<div class="sec-title">Commande</div><div class="card"><div class="list">' +
      '<div class="li"><span>Site</span><span>' + c.site + '</span></div><div class="li"><span>N° de commande</span><span class="n">' + c.id + '</span></div>' +
      '<div class="li"><span>Événement</span><span>' + jourCourt(c.date) + ' · ' + c.lieu + '</span></div>' +
      '<div class="li"><span>Prix d\'achat</span><span class="n">' + fmt(c.prix, c.devise) + (c.devise === 'USD' ? ' ≈ ' + eur(coutEur(c)) : '') + '</span></div>' +
      '<div class="li"><span>Adresse email</span><span>' + c.mail + '</span></div><div class="li"><span>Nom</span><span>' + c.nom + '</span></div>' +
      '<div class="li"><span>Paiement</span><span>' + (/^\d{4}$/.test(c.carte) ? 'Carte •••• ' + c.carte : c.carte) + '</span></div></div></div>' +
    '<div class="btns"><button class="btn" id="rembourse">' + (c.rembourse ? 'Annuler « remboursé »' : 'Marquer remboursé') + '</button>' + (reste > 0 && !c.rembourse ? '<button class="btn" id="vente-main">Vente à la main</button>' : '') + '</div>' +
    '<form class="f" id="form-vente" hidden><label class="field">Billets<input id="vm-q" type="number" min="1" max="' + reste + '" value="' + reste + '" required></label><label class="field">Montant reçu (€)<input id="vm-m" type="number" min="0" step="0.01" required></label><button class="btn primary" type="submit">Enregistrer</button></form>';
}

function vueStats() {
  const parEv = {}, parSite = {};
  commandes.forEach(c => c.ventes.forEach(v => { const p = profitV(c, v); parEv[c.ev] = (parEv[c.ev] || 0) + p; parSite[c.site] = (parSite[c.site] || 0) + p; }));
  const bars = obj => {
    const l = Object.entries(obj).sort((a, b) => b[1] - a[1]), max = Math.max(1, ...l.map(x => Math.abs(x[1]))), neg = l.some(x => x[1] < 0), z = neg ? 50 : 0, sc = neg ? 50 : 100;
    return '<div class="bars">' + l.map(([n, p]) => { const w = Math.abs(p) / max * sc; return '<div class="bar-row"><span class="name">' + n + '</span><span class="n ' + (p >= 0 ? 'plus' : 'neg') + '">' + sign(p) + '</span><div class="track"><div class="fill" style="left:' + (p >= 0 ? z : z - w) + '%;width:' + w + '%;background:var(' + (p >= 0 ? '--good' : '--bad') + ')"></div>' + (neg ? '<div class="zero"></div>' : '') + '</div></div>'; }).join('') + '</div>';
  };
  const ventes = commandes.flatMap(c => c.ventes.map(v => ({ c, v })));
  const recu = ventes.reduce((s, x) => s + x.v.montant, 0), cout = ventes.reduce((s, x) => s + unit(x.c) * x.v.qte, 0);
  return demo + '<h1>Statistiques</h1>' +
    '<div class="kv"><div class="compte"><div class="lbl">Marge moyenne</div><div class="val n">' + Math.round((recu - cout) / cout * 100) + ' %</div><div class="hint">sur ' + ventes.length + ' ventes</div></div>' +
    '<div class="compte"><div class="lbl">Chiffre d\'affaires</div><div class="val n">' + eur(recu) + '</div><div class="hint">' + eur(cout) + ' de coût d\'achat</div></div></div>' +
    '<div class="card pad"><div class="row-head"><h2>Bénéfice par événement</h2></div>' + bars(parEv) + '</div>' +
    '<div class="card pad"><div class="row-head"><h2>Bénéfice par site d\'achat</h2></div>' + bars(parSite) + '</div>';
}

// ---------- Rendu et interactions ----------
function rendre() {
  $.innerHTML = ({ accueil: vueAccueil, billets: vueBillets, operations: vueOperations, stats: vueStats, detail: vueDetail })[vue]();
  const act = vue === 'detail' ? retour : vue;
  document.querySelectorAll('[data-vue]').forEach(b => b.dataset.vue === act ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  brancher();
}
function aller(v, o) { if (v !== 'detail') recherche = ''; vue = v; if (o) Object.assign(window, o); window.scrollTo(0, 0); rendre(); }
let tm; function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.hidden = false; clearTimeout(tm); tm = setTimeout(() => { t.hidden = true; }, 3200); }

function brancher() {
  $.querySelectorAll('[data-detail]').forEach(el => el.addEventListener('click', e => { if (e.target.closest('[data-payer]')) return; retour = vue === 'detail' ? retour : vue; detailId = el.dataset.detail; aller('detail'); }));
  $.querySelectorAll('[data-aller]').forEach(el => el.addEventListener('click', () => {
    if (el.dataset.filtre) filtreOps = el.dataset.filtre; else if (el.dataset.aller === 'operations') filtreOps = 'tout';
    if (el.dataset.fb) filtreBillets = el.dataset.fb; else if (el.dataset.aller === 'billets') filtreBillets = 'tous';
    aller(el.dataset.aller);
  }));
  $.querySelectorAll('[data-fo]').forEach(el => el.addEventListener('click', () => { filtreOps = el.dataset.fo; rendre(); }));
  $.querySelectorAll('.chip[data-fb]').forEach(el => el.addEventListener('click', () => { filtreBillets = el.dataset.fb; rendre(); }));
  const r = document.getElementById('recherche');
  if (r) r.addEventListener('input', () => { recherche = r.value; const p = r.selectionStart; rendre(); const n = document.getElementById('recherche'); n.focus(); n.setSelectionRange(p, p); });
  const ff = document.getElementById('form-frais');
  if (ff) ff.addEventListener('submit', e => { e.preventDefault(); frais.push({ le: document.getElementById('fr-date').value, libelle: document.getElementById('fr-lib').value.trim(), montant: parseFloat(document.getElementById('fr-mt').value) || 0 }); rendre(); toast('Frais ajoutés.'); });

  const c = commandes.find(x => x.id === detailId);
  if (vue !== 'detail' || !c) return;
  $.querySelectorAll('[data-payer]').forEach(el => el.addEventListener('click', () => { const v = c.ventes.find(x => x.id === el.dataset.payer); v.paye = !v.paye; rendre(); toast(v.paye ? 'Vente marquée payée.' : 'Vente remise en attente.'); }));
  const fp = document.getElementById('form-places'), libre = document.getElementById('pl-libre');
  if (libre) libre.addEventListener('change', () => ['pl-rang', 'pl-sieges'].forEach(id => { document.getElementById(id).disabled = libre.checked; }));
  if (fp) fp.addEventListener('submit', e => {
    e.preventDefault();
    [['bloc', 'pl-bloc'], ['rang', 'pl-rang'], ['sieges', 'pl-sieges']].forEach(([k, id]) => { const v = document.getElementById(id).value.trim(); if (v !== c[k]) { c[k] = v; c.auto[k] = false; } });
    c.libre = libre.checked;
    const sel = document.getElementById('pl-section');
    if (sel && sel.value) { c.seatiks.section = sel.value; c.seatiks.auto = false; } else if (c.seatiks.auto) c.seatiks.section = c.libre ? c.bloc : 'Block ' + c.bloc;
    rendre(); toast(c.annonce && c.annonce.active ? 'Places enregistrées, annonce Seatiks mise à jour (simulation).' : 'Places enregistrées.');
  });
  const fa = document.getElementById('form-annonce');
  if (fa) {
    const px = document.getElementById('prix'), reste = c.qte - vendus(c);
    px.addEventListener('input', () => { const p = parseFloat(px.value); document.getElementById('marge').textContent = p > 0 ? sign(p * reste * 0.9 - unit(c) * reste) : '—'; });
    fa.addEventListener('submit', e => { e.preventDefault(); const p = parseFloat(px.value); if (!(p > 0)) return; const neuf = !(c.annonce && c.annonce.active); c.annonce = { prix: p, active: true }; rendre(); toast(neuf ? 'Publié sur Seatiks à ' + eur(p) + ' par billet (simulation).' : 'Prix mis à jour : ' + eur(p) + ' (simulation).'); });
  }
  const ret = document.getElementById('retirer');
  if (ret) ret.addEventListener('click', () => { c.annonce.active = false; rendre(); toast('Annonce retirée de la vente (simulation).'); });
  const rb = document.getElementById('rembourse');
  if (rb) rb.addEventListener('click', () => { c.rembourse = c.rembourse ? null : '2026-10-14'; if (c.rembourse && c.annonce) c.annonce.active = false; rendre(); toast(c.rembourse ? 'Commande marquée remboursée.' : 'Commande remise en stock.'); });
  const vm = document.getElementById('vente-main'), fv = document.getElementById('form-vente');
  if (vm) vm.addEventListener('click', () => { fv.hidden = !fv.hidden; if (!fv.hidden) document.getElementById('vm-m').focus(); });
  if (fv) fv.addEventListener('submit', e => { e.preventDefault(); const q = parseInt(document.getElementById('vm-q').value, 10), m = parseFloat(document.getElementById('vm-m').value); if (!(q > 0) || !(m >= 0)) return; c.ventes.push({ id: 'MAIN-' + (c.ventes.length + 1), le: '2026-10-14', qte: Math.min(q, c.qte - vendus(c)), montant: m, paye: false }); rendre(); toast('Vente ajoutée, bénéfice recalculé.'); });
}

document.querySelectorAll('[data-vue]').forEach(b => b.addEventListener('click', () => { if (b.dataset.vue === 'operations') filtreOps = 'tout'; if (b.dataset.vue === 'billets') filtreBillets = 'tous'; aller(b.dataset.vue); }));
rendre();
</script>
