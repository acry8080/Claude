  { le: '2026-10-01', libelle: 'Nom de domaine du site', montant: 10.99 },
  { le: '2026-09-15', libelle: 'Abonnement iCloud+', montant: 2.99 },
  { le: '2026-10-01', libelle: 'Abonnement iCloud+', montant: 2.99 },
];

// ---------- Calculs ----------
const eur = n => (n < 0 ? '−' : '') + Math.abs(n).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
const sym = c => c.devise === 'USD' ? ' $' : ' €';
const prixAff = (c, n) => Math.abs(n).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + sym(c);
const jour = s => new Date(s + 'T12:00:00').toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
const jourCourt = s => new Date(s + 'T12:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
const vendus = c => c.ventes.reduce((s, v) => s + v.qte, 0);
const coutUnitaire = c => c.prix / c.qte;
const profitVente = (c, v) => v.montant - coutUnitaire(c) * v.qte;
const places = c => c.rang ? [c.bloc, c.rang, c.sieges].filter(Boolean).join(' / ') : 'x' + c.qte + ' ' + c.bloc;
const actif = c => !c.rembourse && !c.annulee && vendus(c) < c.qte;
const manquants = c => [!c.bloc && 'le bloc', !c.libre && !c.rang && 'le rang', !c.libre && !c.sieges && 'les sièges'].filter(Boolean);
const aCompleter = c => actif(c) && (manquants(c).length > 0 || !c.seatiks.section);
const passe = c => new Date(c.date + 'T23:59:00') < AUJOURDHUI;

function statut(c) {
  if (c.rembourse) return { cle: 'rembourse', txt: 'Remboursé' };
  if (c.annulee) return { cle: 'annule', txt: 'Annulation probable' };
  const v = vendus(c);
  if (v >= c.qte) return { cle: 'vendu', txt: 'Vendu' };
  if (v > 0) return { cle: 'partiel', txt: 'Vendu ' + v + '/' + c.qte };
  if (c.annonce && c.annonce.active) return { cle: 'vente', txt: 'En vente' };
  return { cle: 'list', txt: 'À lister' };
}
const pill = c => { const s = statut(c); return '<span class="pill p-' + s.cle + '">' + s.txt + '</span>'; };

function totaux() {
  let profit = 0, aRecevoir = 0, stockValeur = 0, stockBillets = 0, depenses = 0, chiffre = 0;
  commandes.forEach(c => {
    if (!c.rembourse) depenses += c.prix;
    c.ventes.forEach(v => { profit += profitVente(c, v); chiffre += v.montant; if (!v.paye) aRecevoir += v.montant; });
    const reste = c.qte - vendus(c);
    if (!c.rembourse && !c.annulee && reste > 0) { stockBillets += reste; stockValeur += reste * coutUnitaire(c); }
  });
  depenses += autresDepenses.reduce((s, d) => s + d.montant, 0);
  return { profit, aRecevoir, stockValeur, stockBillets, depenses, chiffre };
}

// ---------- Vues ----------
let vueCourante = 'tableau', filtre = 'tous', recherche = '', detailId = null;

const bandeau = '<div class="demo"><strong>Maquette</strong> Toutes les commandes et ventes ici sont des exemples. Les boutons fonctionnent, mais rien n\'est envoyé à Seatiks.</div>';

function vueTableau() {
  const t = totaux();
  const parEv = {};
  commandes.forEach(c => c.ventes.forEach(v => { parEv[c.ev] = (parEv[c.ev] || 0) + profitVente(c, v); }));
  const lignes = Object.entries(parEv).sort((a, b) => b[1] - a[1]);
  const max = Math.max(1, ...lignes.map(l => Math.abs(l[1])));
  const aNeg = lignes.some(l => l[1] < 0);
  const zero = aNeg ? 50 : 0; // en % : axe au milieu s'il y a des pertes
  const echelle = aNeg ? 50 : 100;
  const bars = lignes.map(([ev, p]) => {
    const w = Math.abs(p) / max * echelle;
    const left = p >= 0 ? zero : zero - w;
    return '<div class="bar-row"><span class="bar-name">' + ev + '</span><span class="num ' + (p >= 0 ? 'pos' : 'neg') + '">' + eur(p) + '</span>' +
      '<div class="bar-track"><div class="bar-fill" style="left:' + left + '%;width:' + w + '%;background:var(' + (p >= 0 ? '--good' : '--bad') + ')"></div>' + (aNeg ? '<div class="bar-zero" style="left:50%"></div>' : '') + '</div></div>';
  }).join('');

  const aLister = commandes.filter(c => statut(c).cle === 'list' && !passe(c));
  const nonPayees = commandes.flatMap(c => c.ventes.filter(v => !v.paye));
  const annulees = commandes.filter(c => c.annulee && !c.rembourse);
  const completer = commandes.filter(aCompleter);
  const bientot = commandes.filter(c => { const r = c.qte - vendus(c); const j = (new Date(c.date) - AUJOURDHUI) / 864e5; return r > 0 && !c.rembourse && !c.annulee && j >= 0 && j <= 7; });

  return bandeau +
    '<div class="head"><div><h1>Tableau de bord</h1><p class="sub">Au ' + AUJOURDHUI.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) + '</p></div></div>' +
    '<div class="kpis">' +
      '<div class="kpi"><div class="lbl">Bénéfice réalisé</div><div class="val ' + (t.profit >= 0 ? 'pos' : 'neg') + '">' + eur(t.profit) + '</div><div class="hint">sur ' + eur(t.chiffre) + ' de ventes</div></div>' +
      '<div class="kpi"><div class="lbl">Argent à recevoir</div><div class="val">' + eur(t.aRecevoir) + '</div><div class="hint">' + nonPayees.length + ' vente(s) pas encore payée(s)</div></div>' +
      '<div class="kpi"><div class="lbl">Billets non vendus</div><div class="val">' + t.stockBillets + '</div><div class="hint">' + eur(t.stockValeur) + ' payés à l\'achat</div></div>' +
      '<div class="kpi"><div class="lbl">Dépenses totales</div><div class="val">' + eur(t.depenses) + '</div><div class="hint">achats + autres frais</div></div>' +
    '</div>' +
    '<div class="grid2">' +
      '<section class="panel"><h2>Bénéfice par événement</h2><div class="bars">' + (bars || '<p class="sub">Aucune vente pour l\'instant.</p>') + '</div></section>' +
      '<section class="panel"><h2>À faire</h2><ul class="todo">' +
        '<li><span><b>Places à compléter</b><br><span class="sub">Rang, sièges ou section Seatiks introuvables dans l\'email</span></span><span class="count">' + completer.length + '</span></li>' +
        '<li><span><b>À mettre en vente</b><br><span class="sub">Billets achetés, pas encore listés</span></span><span class="count">' + aLister.length + '</span></li>' +
        '<li><span><b>Match ou concert dans moins de 7 jours</b><br><span class="sub">Il reste des billets à vendre</span></span><span class="count">' + bientot.length + '</span></li>' +
        '<li><span><b>Paiements en attente</b><br><span class="sub">Ventes Seatiks pas encore payées</span></span><span class="count">' + nonPayees.length + '</span></li>' +
        '<li><span><b>Annulations probables</b><br><span class="sub">StubHub : « a further email »</span></span><span class="count">' + annulees.length + '</span></li>' +
      '</ul><div class="actions"><button class="btn" data-aller="billets" data-filtre="completer">Compléter les places</button><button class="btn" data-aller="billets" data-filtre="list">Voir les billets à lister</button></div></section>' +
    '</div>';
}

  const filtres = [['tous', 'Tous'], ['list', 'À lister'], ['vente', 'En vente'], ['vendu', 'Vendus'], ['annule', 'Annulés / remboursés'], ['completer', 'Places à compléter']];

    (rows || '<tr><td colspan="8" class="sub">Aucun billet ne correspond.</td></tr>') + '</tbody></table></div>';
}

function vueVentes() {
  const lignes = commandes.flatMap(c => c.ventes.map(v => ({ c, v }))).sort((a, b) => b.v.le.localeCompare(a.v.le));
  let tRecu = 0, tCout = 0;
  const rows = lignes.map(({ c, v }) => {
    const cout = coutUnitaire(c) * v.qte, p = v.montant - cout; tRecu += v.montant; tCout += cout;
    return '<tr class="click" data-detail="' + c.id + '"><td class="num">' + jour(v.le) + '</td><td class="ev">' + c.ev + '<small>' + places(c) + '</small></td><td class="num r">' + v.qte + '</td><td class="num r">' + eur(v.montant) + '</td><td class="num r">' + eur(cout) + '</td><td class="num r ' + (p >= 0 ? 'pos' : 'neg') + '">' + eur(p) + '</td><td class="num r">' + Math.round(p / cout * 100) + ' %</td><td><button class="pill ' + (v.paye ? 'p-vendu' : 'p-attente') + '" style="border:0" data-payer="' + c.id + '|' + v.id + '" title="Cliquer pour changer">' + (v.paye ? 'Payé' : 'En attente') + '</button></td></tr>';
  }).join('');
  const pT = tRecu - tCout;
  return bandeau +
    '<div class="head"><div><h1>Ventes</h1><p class="sub">Bénéfice de chaque vente = montant reçu de Seatiks − prix d\'achat des billets vendus</p></div></div>' +
    '<div class="table-wrap"><table><thead><tr><th>Vendu le</th><th>Événement</th><th class="r">Billets</th><th class="r">Reçu</th><th class="r">Coût</th><th class="r">Bénéfice</th><th class="r">Marge</th><th>Paiement</th></tr></thead><tbody>' + rows + '</tbody>' +
    '<tfoot><tr><td colspan="3">Total (' + lignes.length + ' ventes)</td><td class="num r">' + eur(tRecu) + '</td><td class="num r">' + eur(tCout) + '</td><td class="num r ' + (pT >= 0 ? 'pos' : 'neg') + '">' + eur(pT) + '</td><td class="num r">' + (tCout ? Math.round(pT / tCout * 100) : 0) + ' %</td><td></td></tr></tfoot></table></div>';
}

function vueDepenses() {
  const achats = commandes.map(c => ({ le: c.achat, libelle: 'Achat ' + c.site + ' · ' + c.ev, detail: places(c), montant: c.rembourse ? 0 : c.prix, rembourse: c.rembourse, id: c.id }));
  const tout = achats.concat(autresDepenses.map(d => ({ ...d, detail: 'Autre dépense' }))).sort((a, b) => b.le.localeCompare(a.le));
  const parMois = {};
  tout.forEach(d => { const m = d.le.slice(0, 7); parMois[m] = (parMois[m] || 0) + d.montant; });
  const mois = Object.keys(parMois).sort().reverse();
  const total = tout.reduce((s, d) => s + d.montant, 0);
  return bandeau +
    '<div class="head"><div><h1>Dépenses</h1><p class="sub">Achats de billets (importés des emails) et autres frais</p></div></div>' +
    '<div class="kpis">' + mois.slice(0, 3).map(m => '<div class="kpi"><div class="lbl">' + new Date(m + '-15').toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }) + '</div><div class="val">' + eur(parMois[m]) + '</div></div>').join('') +
      '<div class="kpi"><div class="lbl">Total</div><div class="val">' + eur(total) + '</div></div></div>' +
    '<section class="panel" style="margin-bottom:16px"><h2>Ajouter une dépense</h2><form class="inline" id="form-depense"><label class="field">Date<input id="dep-date" type="date" value="2026-10-14" required></label><label class="field wide">Libellé<input id="dep-libelle" type="text" placeholder="Ex. frais de transfert" required></label><label class="field">Montant (€)<input id="dep-montant" type="number" min="0" step="0.01" required></label><button class="btn primary" type="submit">Ajouter</button></form></section>' +
    '<div class="table-wrap"><table><thead><tr><th>Date</th><th>Dépense</th><th class="r">Montant</th></tr></thead><tbody>' +
    tout.map(d => '<tr' + (d.id ? ' class="click" data-detail="' + d.id + '"' : '') + '><td class="num">' + jour(d.le) + '</td><td class="ev">' + d.libelle + '<small>' + d.detail + (d.rembourse ? ' · remboursé' : '') + '</small></td><td class="num r">' + eur(d.montant) + '</td></tr>').join('') +
    '</tbody></table></div>';
}

// ---------- Rendu et interactions ----------
function rendre() {
  const vues = { tableau: vueTableau, billets: vueBillets, ventes: vueVentes, depenses: vueDepenses, detail: vueDetail };
  $vue.innerHTML = vues[vueCourante]();
  const actif = vueCourante === 'detail' ? 'billets' : vueCourante;
  document.querySelectorAll('nav button[data-vue]').forEach(b => { if (b.dataset.vue === actif) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  brancher();
}
function aller(vue, opts) { vueCourante = vue; if (opts && opts.filtre) filtre = opts.filtre; window.scrollTo(0, 0); rendre(); }

let minuteur;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(minuteur); minuteur = setTimeout(() => { t.hidden = true; }, 3200); }

function brancher() {
  $vue.querySelectorAll('[data-detail]').forEach(el => el.addEventListener('click', e => { if (e.target.closest('[data-payer]')) return; detailId = el.dataset.detail; aller('detail'); }));
  $vue.querySelectorAll('[data-aller]').forEach(el => el.addEventListener('click', () => aller(el.dataset.aller, { filtre: el.dataset.filtre })));
  $vue.querySelectorAll('.chip[data-filtre]').forEach(el => el.addEventListener('click', () => { filtre = el.dataset.filtre; rendre(); }));
  const r = document.getElementById('recherche');
  if (r) r.addEventListener('input', () => { recherche = r.value; const pos = r.selectionStart; rendre(); const n = document.getElementById('recherche'); n.focus(); n.setSelectionRange(pos, pos); });
  $vue.querySelectorAll('[data-payer]').forEach(el => el.addEventListener('click', () => {
    const [cid, vid] = el.dataset.payer.split('|'); const v = commandes.find(c => c.id === cid).ventes.find(x => x.id === vid);
    v.paye = !v.paye; rendre(); toast(v.paye ? 'Vente marquée comme payée.' : 'Vente marquée en attente de paiement.');
  }));

  const c = commandes.find(x => x.id === detailId);
  const fp = document.getElementById('form-places');
  if (fp) {
    const libre = document.getElementById('pl-libre');
    libre.addEventListener('change', () => { ['pl-rang', 'pl-sieges'].forEach(id => { document.getElementById(id).disabled = libre.checked; }); });
    fp.addEventListener('submit', e => {
      e.preventDefault();
      [['bloc', 'pl-bloc'], ['rang', 'pl-rang'], ['sieges', 'pl-sieges']].forEach(([k, id]) => {
        const v = document.getElementById(id).value.trim();
        if (v !== c[k]) { c[k] = v; c.auto[k] = false; }
      });
      c.libre = libre.checked;
      if (c.seatiks.auto) c.seatiks.section = c.libre ? c.bloc : 'Block ' + c.bloc;
      rendre();
      toast(c.annonce && c.annonce.active ? 'Places enregistrées, annonce Seatiks mise à jour (simulation).' : 'Places enregistrées. Elles seront utilisées pour l\'annonce Seatiks.');
    });
  }
  const ps = document.getElementById('pl-section');
  if (ps) ps.addEventListener('change', () => { if (!ps.value) return; c.seatiks.section = ps.value; c.seatiks.auto = false; rendre(); toast('Section Seatiks choisie : ' + ps.value + '.'); });
  const fa = document.getElementById('form-annonce');
  if (fa) {
    const champ = document.getElementById('prix-annonce');
    champ.addEventListener('input', () => { const p = parseFloat(champ.value); const reste = c.qte - vendus(c); document.getElementById('marge').textContent = p > 0 ? eur(p * reste * 0.9 - coutUnitaire(c) * reste) : '—'; });
    fa.addEventListener('submit', e => {
      e.preventDefault(); const p = parseFloat(champ.value); if (!(p > 0)) return;
      const nouveau = !(c.annonce && c.annonce.active); c.annonce = { prix: p, active: true }; rendre();
      toast(nouveau ? 'Annonce publiée sur Seatiks à ' + eur(p) + ' par billet (simulation).' : 'Prix mis à jour sur Seatiks : ' + eur(p) + ' (simulation).');
    });
  }
  const ret = document.getElementById('retirer');
  if (ret) ret.addEventListener('click', () => { c.annonce.active = false; rendre(); toast('Annonce retirée de la vente (simulation).'); });
  const rb = document.getElementById('rembourse');
  if (rb) rb.addEventListener('click', () => { c.rembourse = !c.rembourse; if (c.rembourse && c.annonce) c.annonce.active = false; rendre(); toast(c.rembourse ? 'Commande marquée comme remboursée.' : 'Commande remise en stock.'); });
  const vm = document.getElementById('vente-main'), fv = document.getElementById('form-vente');
  if (vm) vm.addEventListener('click', () => { fv.hidden = !fv.hidden; if (!fv.hidden) document.getElementById('vm-montant').focus(); });
  if (fv) fv.addEventListener('submit', e => {
    e.preventDefault();
    const q = parseInt(document.getElementById('vm-qte').value, 10), m = parseFloat(document.getElementById('vm-montant').value);
    if (!(q > 0) || !(m >= 0)) return;
    c.ventes.push({ id: 'MAIN-' + (c.ventes.length + 1), le: '2026-10-14', qte: Math.min(q, c.qte - vendus(c)), montant: m, paye: false });
    rendre(); toast('Vente ajoutée. Bénéfice recalculé.');
  });
  const fd = document.getElementById('form-depense');
  if (fd) fd.addEventListener('submit', e => {
    e.preventDefault();
    autresDepenses.push({ le: document.getElementById('dep-date').value, libelle: document.getElementById('dep-libelle').value.trim(), montant: parseFloat(document.getElementById('dep-montant').value) || 0 });
    rendre(); toast('Dépense ajoutée.');
  });
}

document.querySelectorAll('nav button[data-vue]').forEach(b => b.addEventListener('click', () => aller(b.dataset.vue, b.dataset.vue === 'billets' ? { filtre: 'tous' } : null)));
rendre();
</script>
